name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # El smoke test del CLI lee los PRs con gh.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo: el smoke test del CLI lee ramas y anclas.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test del CLI compilado (sin credenciales)
        run: node dist/entrypoints/cli.js --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test

  # La action compuesta de este repositorio, tal como la usa otro repo, en
  # dry-run y sin secrets: valida los documentos sin consultar Notion.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        with:
          dry-run: true
      # Fail closed: an unknown dry-run value must stop the step instead of
      # running a real sync.
      - id: dry-run-invalido
        uses: ./
        continue-on-error: true
        with:
          dry-run: 'on'
      - name: Expect the invalid dry-run value to fail
        if: steps.dry-run-invalido.outcome != 'failure'
        run: |
          echo "::error::dry-run: 'on' should have failed the action step."
          exit 1
