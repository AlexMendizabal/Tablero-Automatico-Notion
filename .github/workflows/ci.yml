name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # El smoke test del CLI lee los PRs con gh.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo: el smoke test del CLI lee ramas y anclas.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test del CLI compilado (sin credenciales)
        run: node dist/entrypoints/cli.js --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test

  # La action compuesta de este repositorio, tal como la usa otro repo, en
  # dry-run y sin secrets: valida los documentos sin consultar Notion.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        with:
          dry-run: true
      # Fail closed: the dry-run classifier must accept only known values and
      # reject anything else, so a typo never turns into a real sync.
      - name: Check dry-run input classification
        shell: bash
        run: |
          set -u
          fallas=0
          esperar() { # $1 = input, $2 = expected output, or "EXIT2"
            if salida="$(bash scripts/dry-run-flag.sh "$1")"; then obtenido="$salida"; else obtenido="EXIT$?"; fi
            if [ "$obtenido" != "$2" ]; then
              echo "::error::dry-run input [$1] gave [$obtenido], expected [$2]"
              fallas=1
            fi
          }
          esperar 'true' '--dry-run'
          esperar ' YES ' '--dry-run'
          esperar '1' '--dry-run'
          esperar 'false' ''
          esperar 'No' ''
          esperar '' ''
          esperar 'on' 'EXIT2'
          esperar 'tr ue' 'EXIT2'
          esperar $'true\n::add-mask::x' 'EXIT2'
          exit "$fallas"
